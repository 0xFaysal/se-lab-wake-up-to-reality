services:
  - type: web
    name: parkease-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: ParkEase API
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: parkease-redis
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: PASSWORD_RESET_URL
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: COOKIE_SAME_SITE
        value: none
      - key: ENABLE_API_DOCS
        value: "false"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: VERIFICATION_CODE_SECRET
        generateValue: true
      - key: AUTH_METADATA_HASH_SECRET
        generateValue: true
      - key: PROPERTY_ADDRESS_FINGERPRINT_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: JWT_ISSUER
        value: parkease-api
      - key: JWT_AUDIENCE
        value: parkease-client
      - key: JWT_ACCESS_EXPIRES_MINUTES
        value: "15"
      - key: JWT_REFRESH_SHORT_DAYS
        value: "1"
      - key: JWT_REFRESH_LONG_DAYS
        value: "30"
      - key: PASSWORD_RESET_EXPIRES_MINUTES
        value: "15"
      - key: VERIFICATION_CODE_EXPIRES_MINUTES
        value: "10"
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_WORKER_ENABLED
        value: "true"
      - key: EMAIL_WORKER_POLL_INTERVAL_MS
        value: "5000"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EXPOSE_DEVELOPMENT_AUTH_CODES
        value: "false"

  - type: keyvalue
    name: parkease-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
