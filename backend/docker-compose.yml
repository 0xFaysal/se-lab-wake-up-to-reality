services:
  postgres:
    image: postgres:18-alpine
    container_name: parkease-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: parkease
      POSTGRES_PASSWORD: parkease_dev_password
      POSTGRES_DB: parkease
    ports:
      - "5432:5432"
    volumes:
      - parkease_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkease -d parkease"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  redis:
    image: redis:8-alpine
    container_name: parkease-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - parkease_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  parkease_postgres_data:
  parkease_redis_data:
