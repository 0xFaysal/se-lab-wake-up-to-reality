name: Check PR Source Branch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source branch
        if: github.event.pull_request.head.repo.full_name != github.repository || (github.head_ref != 'develop')
        run: |
          echo "ERROR: Pull Requests targeting 'main' are only allowed from this repository and from 'develop', 'feature/*', or 'hotfix/*' branches."
          echo "Your PR head is '${{ github.event.pull_request.head.repo.full_name }}:${{ github.head_ref }}'."
          echo "Please open a PR from an allowed branch."
          exit 1
