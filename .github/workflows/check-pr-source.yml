name: Check PR Source Branch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR is from develop branch
        if: github.head_ref != 'develop' || github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "ERROR: Pull Requests targeting 'main' are only allowed from this repository's 'develop' branch."
          echo "Your PR head is '${{ github.event.pull_request.head.repo.full_name }}:${{ github.head_ref }}'."
          echo "Please close this PR and open a PR targeting the 'develop' branch first."
          exit 1